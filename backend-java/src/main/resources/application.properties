# ============================================================
# AI INTERVIEW PLATFORM — Java Spring Boot Configuration
# ============================================================
# Copy backend/.env and rename keys here, or set as env vars.
# Env vars override these defaults automatically.

# HTTP REST API port (same as Node.js backend: 5001)
server.port=5001

# Socket.io runs on a separate port (update NEXT_PUBLIC_SOCKET_URL in frontend/.env.local)
socketio.port=5002

# MongoDB — leave empty to use file-based session fallback
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ai-interview}

# OpenAI
openai.api.key=${OPENAI_API_KEY:}

# Groq (free fallback)
groq.api.key=${GROQ_API_KEY:}

# ElevenLabs TTS
elevenlabs.api.key=${ELEVENLABS_API_KEY:}
elevenlabs.voice.id=${ELEVENLABS_VOICE_ID:pNInz6obpgDQGcFmaJgB}

# Clerk — JWKS URL for JWT verification (RS256)
# Derived from your publishable key domain, e.g.:
# https://exact-sculpin-81.clerk.accounts.dev/.well-known/jwks.json
clerk.jwks.url=${CLERK_JWKS_URL:}
clerk.publishable.key=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:}

# CORS — allow frontend origin
frontend.url=${FRONTEND_URL:http://localhost:3000}

# Session TTL (hours)
session.ttl.hours=${SESSION_TTL_HOURS:24}

# Mock AI responses (true = no API calls, for development testing)
mock.ai=${MOCK_AI:false}

# File upload size limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# We manage MongoDB connection manually in MongoConfig.java (handles missing URI gracefully)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration

# Logging
logging.level.com.aiinterview=INFO
logging.level.com.corundumstudio.socketio=WARN
