# =============================================
# SERVER — REST API port
# =============================================
server.port=${PORT:5001}

# =============================================
# MONGODB
# =============================================
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ai-interview}
spring.data.mongodb.auto-index-creation=false

# =============================================
# MULTIPART (resume upload: 5 MB, audio: 10 MB)
# =============================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =============================================
# SOCKET.IO (netty-socketio) — separate port
# =============================================
socketio.port=${SOCKET_PORT:5002}
socketio.hostname=0.0.0.0

# =============================================
# AI PROVIDERS (read from .env via dotenv-java)
# =============================================
ai.openai.key=${OPENAI_API_KEY:}
ai.openai.base-url=https://api.openai.com/v1
ai.groq.key=${GROQ_API_KEY:}
ai.groq.base-url=https://api.groq.com/openai/v1
ai.elevenlabs.key=${ELEVENLABS_API_KEY:}
ai.elevenlabs.voice-id=${ELEVENLABS_VOICE_ID:pNInz6obpgDQGcFmaJgB}
ai.mock=${MOCK_AI:false}

# =============================================
# CORS — allowed frontend origins
# =============================================
cors.allowed-origins=${FRONTEND_URL:http://localhost:3000},http://localhost:3001,http://127.0.0.1:3000

# =============================================
# SESSION TTL
# =============================================
session.ttl-hours=${SESSION_TTL_HOURS:24}

# =============================================
# LOGGING
# =============================================
logging.level.com.aiinterview=INFO
logging.level.io.netty=WARN
logging.level.org.springframework.data.mongodb=WARN
